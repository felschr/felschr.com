name: Sync upstream

on:
  schedule:
    - cron: '0 3 * * 1'
      timezone: UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    # Only the canonical instance (git.felschr.com) can push; the Codeberg
    # mirror also reads this file, so skip it there.
    if: startsWith(forgejo.server_url, 'https://git.felschr.com')
    runs-on: native
    timeout-minutes: 15
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ forgejo.token }}

      - name: Merge upstream
        run: |
          git config user.name 'Felix Schröter'
          git config user.email 'dev@felschr.com'
          git config commit.gpgsign false
          git remote add upstream https://github.com/singi-labs/sifa-page.git 2>/dev/null || true
          git fetch upstream main
          git merge -m 'Merge upstream/main (singi-labs/sifa-page)' upstream/main

      - name: Push
        run: git push origin main

      - name: Open issue on conflict
        if: failure()
        env:
          TOKEN: ${{ forgejo.token }}
          SERVER: ${{ forgejo.server_url }}
          REPO: ${{ forgejo.repository }}
        run: |
          git merge --abort 2>/dev/null || true
          body="Automatic merge of singi-labs/sifa-page failed. Resolve locally with scripts/upstream-sync.sh, commit the merge, then git push origin main."
          curl -sS -X POST "$SERVER/api/v1/repos/$REPO/issues" \
            -H "Authorization: token $TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"title\":\"Upstream sync failed\",\"body\":\"$body\"}"
